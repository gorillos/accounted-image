name: Build Accounted image

# Builds erp-mafia/accounted at a given ref with OUR extension list
# (extensions.self-hosted.json in this repo, which adds arcim-migration) and
# pushes it to GHCR. Needs a PUBLIC repo: only public repos get the free
# 16 GB ubuntu-latest runners; the Next/Turbopack build does not fit in 7 GB.
#
# Server side: docker pull ghcr.io/<owner>/accounted:<tag>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag, branch or commit of erp-mafia/accounted (e.g. 2026-11-19)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (extension list)
        uses: actions/checkout@v4
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout upstream Accounted
        uses: actions/checkout@v4
        with:
          repository: erp-mafia/accounted
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Apply our extension list
        run: |
          cp overlay/extensions.self-hosted.json src/docker/extensions.self-hosted.json
          echo "Extensions:"; cat src/docker/extensions.self-hosted.json
          echo "SHA=$(git -C src rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "REF_TAG=$(echo '${{ inputs.ref }}' | tr -c 'A-Za-z0-9_.-\n' '-')" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/$(echo '${{ github.repository_owner }}' | tr 'A-Z' 'a-z')/accounted" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: src
          file: src/docker/Dockerfile
          platforms: linux/amd64
          build-args: EXTENSIONS_PRESET=self-hosted
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:${{ env.REF_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=https://github.com/erp-mafia/accounted
