name: Build Accounted image

# Builds erp-mafia/accounted at a given ref with OUR extension list
# (extensions.self-hosted.json in this repo, which adds arcim-migration) and
# pushes it to GHCR. Needs a PUBLIC repo: only public repos get the free
# 16 GB ubuntu-latest runners; the Next/Turbopack build does not fit in 7 GB.
#
# Server side: docker pull ghcr.io/<owner>/accounted:<tag>

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream tag, branch or commit of erp-mafia/accounted (e.g. 2026-11-19)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (extension list)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: overlay
          persist-credentials: false

      - name: Checkout upstream Accounted
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: erp-mafia/accounted
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      - name: Apply our extension list
        env:
          REF: ${{ inputs.ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          cp overlay/extensions.self-hosted.json src/docker/extensions.self-hosted.json
          echo "Extensions:"; cat src/docker/extensions.self-hosted.json
          sha=$(git -C src rev-parse --short=7 HEAD)
          ref_tag=$(printf '%s' "$REF" | sed 's/[^A-Za-z0-9_.-]/-/g')
          image="ghcr.io/$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')/accounted"
          test -n "$sha" && test -n "$ref_tag"
          { echo "SHA=$sha"; echo "REF_TAG=$ref_tag"; echo "IMAGE=$image"; } >> "$GITHUB_ENV"
          echo "Will push $image:$sha and $image:$ref_tag"

      - uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: src
          file: src/docker/Dockerfile
          platforms: linux/amd64
          build-args: EXTENSIONS_PRESET=self-hosted
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:${{ env.REF_TAG }}
          labels: |
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.source=https://github.com/erp-mafia/accounted
